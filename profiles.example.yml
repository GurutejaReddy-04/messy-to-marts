# Example dbt profiles configuration for PostgreSQL warehouse connection.
# Copy this file to 'profiles.yml' or '~/.dbt/profiles.yml' and customize credentials as needed.
# Supports dynamic override via environment variables (DB_HOST, DB_USER, DB_PASSWORD, DB_PORT, DB_NAME).

analytics_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', env_var('DBT_HOST', 'localhost')) }}"
      user: "{{ env_var('DB_USER', env_var('DBT_USER', 'postgres')) }}"
      password: "{{ env_var('DB_PASSWORD', env_var('DBT_PASSWORD', 'postgres')) }}"
      port: "{{ env_var('DB_PORT', env_var('DBT_PORT', '5432')) | as_number }}"
      dbname: "{{ env_var('DB_NAME', env_var('DBT_DBNAME', 'analytics_pipeline')) }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 4
      keepalives_idle: 0
