name: Scheduled dbt Run

on:
  schedule:
    # Trigger nightly at 05:00 UTC (10:30 AM IST)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scheduled_run:
    name: Execute Nightly dbt Build
    runs-on: ubuntu-latest

    env:
      # Ephemeral test database credentials scoped exclusively to this CI runner & container
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci_test_ephemeral_password
      DBT_PASSWORD: ci_test_ephemeral_password
      DB_NAME: analytics_pipeline

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_ephemeral_password
          POSTGRES_DB: analytics_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.5 dbt-postgres==1.11.0 psycopg2-binary sqlfluff

      - name: Configure dbt profiles
        run: cp profiles.example.yml profiles.yml

      - name: Load raw data into PostgreSQL warehouse
        run: |
          python load_raw_data.py

      - name: Validate dbt connection (dbt debug)
        run: |
          dbt debug --profiles-dir .

      - name: Compile dbt models (dbt compile)
        run: |
          dbt compile --profiles-dir .

      - name: Execute dbt transformations (dbt run)
        run: |
          dbt run --profiles-dir .

      - name: Execute data quality assertions (dbt test)
        run: |
          dbt test --profiles-dir .

      - name: Run SQL style linting (sqlfluff)
        run: |
          sqlfluff lint models/
