name: dbt CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Build, Test & Lint Analytics Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres psycopg2-binary sqlfluff

      - name: Configure dbt profiles
        run: cp profiles.example.yml profiles.yml

      - name: Load raw data into PostgreSQL service
        run: |
          python load_raw_data.py
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: analytics_pipeline

      - name: Validate dbt connection (dbt debug)
        run: |
          dbt debug --profiles-dir .
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: analytics_pipeline

      - name: Build dbt models and run tests (dbt build)
        run: |
          dbt build --profiles-dir .
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: analytics_pipeline

      - name: Run SQL style linting (sqlfluff)
        run: |
          sqlfluff lint models/
